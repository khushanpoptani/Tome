[package]
name = "tome-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
chrono = "0.4.42"
flate2 = "1.1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-http = { version = "=2.7.0", default-features = false }
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
