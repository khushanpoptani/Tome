[package]
name = "tome-server-dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tauri = { version = "=2.11.6", features = ["image-png", "tray-icon"] }
time = { version = "0.3.43", features = ["formatting"] }
tokio = { version = "1.47.1", features = ["sync", "time"] }
tome-server = { path = "../../server" }

[lints]
workspace = true
